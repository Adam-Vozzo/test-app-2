name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  # Deploys only when Settings > Pages > Source is "GitHub Actions". With "Deploy from a
  # branch" GitHub publishes the branch itself, so this just reports and stays green.
  pages-config:
    name: Check Pages source
    needs: test
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.check.outputs.build_type }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null); then :; else build_type=none; fi
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"
          if [ "$build_type" != "workflow" ]; then
            echo "::notice title=GitHub Pages::Not deploying from this workflow (Pages source: ${build_type}). Use Settings > Pages > Source: 'Deploy from a branch' (main, / root) or 'GitHub Actions'."
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: pages-config
    if: needs.pages-config.outputs.build_type == 'workflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Assemble site (runtime files only)
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest css src vendor assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
